<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rubik's Cube | Rubikan</title>
  <link rel="icon" type="image/png" href="/assets/Logo.png" />`n  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js",
        "cubejs": "https://jspm.dev/cubejs"
      }
    }
  </script>
</head>

<body>
  <nav class="navbar"></nav>

  <div id="cube-3x3-view">
    <div class="art-badge">Rubik's Cube (3x3x3)</div>
    <div class="uicontainer-overlay">
      <div class="controls">
        <button id="shuffleBtn"><i class="fas fa-random"></i> Shuffle</button>
        <button id="resetBtn"><i class="fas fa-undo"></i> Reset</button>
        <button id="resetOrientationBtn"><i class="fas fa-sync-alt"></i> Reset Orientation</button>
      </div>
    </div>
    <div class="bottom-controls">
      <div class="row">
        <button id="btnL" title="L">L</button>
        <button id="btnM" title="M">M</button>
        <button id="btnR" title="R">R</button>
        <button id="btnU" title="U">U</button>
        <button id="btnE" title="E">E</button>
        <button id="btnD" title="D">D</button>
        <button id="btnF" title="F">F</button>
        <button id="btnS" title="S">S</button>
        <button id="btnB" title="B">B</button>
      </div>
      <div class="row">
        <button id="btnL_prime" title="L'">L'</button>
        <button id="btnM_prime" title="M'">M'</button>
        <button id="btnR_prime" title="R'">R'</button>
        <button id="btnU_prime" title="U'">U'</button>
        <button id="btnE_prime" title="E'">E'</button>
        <button id="btnD_prime" title="D'">D'</button>
        <button id="btnF_prime" title="F'">F'</button>
        <button id="btnS_prime" title="S'">S'</button>
        <button id="btnB_prime" title="B'">B'</button>
      </div>
    </div>
  </div>

  <div id="app"></div>

  <script type="module">
    import { initNavbar } from '/js/navbar.js';
    import '/js/cube-3x3.js';

    initNavbar();

    // Initialize the module by dispatching the route event
    window.dispatchEvent(new CustomEvent('route-changed', { detail: '/cubes/3x3x3-cube' }));
  </script>
</body>

</html>
